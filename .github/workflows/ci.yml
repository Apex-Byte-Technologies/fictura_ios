name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Unit tests (macOS host)
        run: swift test
      - name: Build for the iOS Simulator
        run: xcodebuild -scheme Fictura -destination 'generic/platform=iOS Simulator' build -quiet
